name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gp
          POSTGRES_PASSWORD: gp
          POSTGRES_DB: gp_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: API tests (in-memory PGlite)
        run: npm test
      - name: API tests (real Postgres)
        run: npm test -w @guidepost/api
        env:
          TEST_DATABASE_URL: postgres://gp:gp@localhost:5432/gp_test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end (extension + API + dashboard)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: guidepost-extension
          path: apps/extension/dist/
