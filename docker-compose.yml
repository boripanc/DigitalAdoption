# Local Postgres for the API. Without it, the API falls back to an embedded PGlite database in apps/api/.pglite.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: guidepost
      POSTGRES_PASSWORD: guidepost
      POSTGRES_DB: guidepost
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
